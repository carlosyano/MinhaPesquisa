        - { name: entidade, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: de, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: ate, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Página de eventos
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
