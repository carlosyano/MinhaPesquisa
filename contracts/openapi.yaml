openapi: 3.0.3
info:
  title: MinhaPesquisa API
  version: 0.2.6
  description: |
    API do SaaS MinhaPesquisa — digitalização de pesquisas em papel com leitura por IA,
    revisão humana e dashboards anonimizados, em conformidade com a LGPD.
    Fonte normativa: REQ v1.9 e PLANO.md v2.10. Contract-first — este arquivo valida
    requisição e resposta (DEC-049). Erros seguem RFC 9457 (Problem Details) com catálogo ERR fechado.
    Segurança: rotas públicas declaram `security: []`; rotas de MFA usam a pré-sessão (DEC-050);
    demais rotas exigem sessão, e toda mutação exige também o token CSRF (os dois esquemas no
    mesmo objeto de segurança significam E, não OU).
  contact:
    name: Carlos Yano
servers:
  - url: https://staging.minhapesquisa.example.com.br
    description: Staging (dados sintéticos)
  - url: https://api.minhapesquisa.example.com.br
    description: Produção (bloqueada até GX-001)

tags:
  - name: auth
    description: Autenticação, sessão, MFA, convites e recuperação de senha (RF-002)
  - name: admin
    description: Usuários, perfis, vínculos e concessões de acesso individual (RF-001)
  - name: projects
    description: Ciclo de vida e parâmetros de projetos (RF-003)
  - name: forms
    description: Formulários, versões, publicação e PDF (RF-004)
  - name: upload
    description: Upload de imagens, identificação e cota (RF-006, RF-007)
  - name: review
    description: Fila de revisão, conclusão, assinatura, descarte e reabertura (RF-008)
  - name: dashboard
    description: Agregados, grupos e ficha individual (RF-009)
  - name: lgpd
    description: Exportação, direitos do titular e auditoria (RF-010)

security:
  - sessionCookie: []

paths:
  # ───────────────────────────── auth (RF-002) ─────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Primeira etapa do login (e-mail e senha)
      description: |
        Rota pública. Valida e-mail e senha e cria uma pré-sessão restrita às rotas de MFA
        (DEC-050), sempre na etapa `mfa_verificacao`. Usuário com `mfa_ativo = false` recebe
        ERR-013 sem pré-sessão; o cadastro de MFA começa só por acceptInvite ou acceptMfaReset
        (DEC-082). Falha → ERR-013; 5 falhas em 15 min para o mesmo e-mail, exista ou não a
        conta → ERR-014 (CA-026). O MFA é obrigatório para todos os perfis (DEC-025).
      x-trace: [RF-002, CA-026, CA-037b, DEC-025, DEC-050, DEC-082]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Pré-sessão criada; próxima etapa informada
          headers:
            Set-Cookie:
              description: Cookies mp_pre_session (httpOnly, 5 min) e mp_csrf
              schema: { type: string }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/LoginThrottled' }

  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [auth]
      summary: Segunda etapa do login (código TOTP)
      description: |
        Valida o código TOTP de quem já tem MFA e cria a sessão plena (DEC-050).
        Só na etapa `mfa_verificacao` da pré-sessão; fora dela → ERR-018 (CA-026b).
      x-trace: [RF-002, CA-026, CA-026b, DEC-050]
      security:
        - preSessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCode' }
      responses:
        '200':
          description: Sessão criada
          headers:
            Set-Cookie:
              description: Cookie mp_session (httpOnly, SameSite)
              schema: { type: string }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '400': { $ref: '#/components/responses/MfaInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/MfaConflict' }
        '429': { $ref: '#/components/responses/LoginThrottled' }

  /auth/mfa/setup/start:
    post:
      operationId: startMfaSetup
      tags: [auth]
      summary: Gera o segredo TOTP no servidor (primeiro acesso ou após reset)
      description: |
        O segredo é gerado pelo servidor, gravado cifrado e devolvido uma única vez para
        cadastro no aplicativo autenticador (DEC-050, CA-035, CA-037b).
        Só na etapa `mfa_cadastro` da pré-sessão e com `mfa_ativo = false` no momento da chamada;
        fora disso → ERR-018, sem alterar o segredo existente (CA-026b).
      x-trace: [RF-002, CA-026b, CA-035, CA-037b, DEC-050]
      security:
        - preSessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Segredo gerado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSetupStart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/mfa/setup:
    post:
      operationId: setupMfa
      tags: [auth]
      summary: Confirma o cadastro do MFA com um código e cria a sessão
      description: |
        Confirma o segredo gerado em startMfaSetup (CA-035, CA-037b). Só na etapa `mfa_cadastro`
        e com `mfa_ativo = false`; fora disso → ERR-018, sem criar sessão (CA-026b). Ao concluir,
        as demais pré-sessões do usuário são encerradas.
      x-trace: [RF-002, CA-026b, CA-035, CA-037b, DEC-050]
      security:
        - preSessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCode' }
      responses:
        '200':
          description: MFA ativo; sessão criada
          headers:
            Set-Cookie:
              description: Cookie mp_session (httpOnly, SameSite)
              schema: { type: string }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '400': { $ref: '#/components/responses/MfaInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/MfaConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerra a sessão atual
      description: Invalida a sessão atual em banco (DEC-044).
      x-trace: [RF-002, DEC-044]
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/session:
    get:
      operationId: getCurrentSession
      tags: [auth]
      summary: Dados da sessão atual (usuário, perfis, projetos)
      description: Dados da sessão atual (usuário, perfis, projetos).
      x-trace: [RF-002]
      responses:
        '200':
          description: Sessão ativa
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Solicita recuperação de senha (link de uso único, 60 min)
      description: Rota pública. A resposta é idêntica exista ou não a conta (CA-037).
      x-trace: [RF-002, CA-037]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '202':
          description: Aceito
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Define nova senha com o token recebido por e-mail
      description: |
        Rota pública. Token inválido, expirado ou usado → ERR-011. Senha fora da política
        (P.2) → ERR-001. Encerra todas as sessões do usuário.
      x-trace: [RF-002, CA-037]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPasswordResetRequest' }
      responses:
        '204': { description: Senha redefinida }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/invites/accept:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Aceita convite (24 h, uso único) e define a senha
      description: |
        Rota pública. Convite vencido ou já usado → ERR-011 (CA-035). Cria pré-sessão com
        etapa `mfa_cadastro`. O convite só é consumido quando setupMfa conclui; dentro das 24 h,
        nova chamada redefine a senha e cria nova pré-sessão.
      x-trace: [RF-002, CA-035, DEC-032]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: Senha definida; pré-sessão criada para cadastro do MFA
          headers:
            Set-Cookie:
              description: Cookies mp_pre_session e mp_csrf
              schema: { type: string }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/mfa-reset/accept:
    post:
      operationId: acceptMfaReset
      tags: [auth]
      summary: Usa o link de reset de MFA (24 h, uso único) com a senha
      description: |
        Rota pública. Valida o token de reset de MFA e a senha atual do usuário dono do token e
        cria pré-sessão com etapa `mfa_cadastro` (DEC-082, CA-037b). Token vencido ou já usado →
        ERR-011; senha errada → ERR-013 (conta como falha de login; 5 falhas → ERR-014), sem
        consumir o token. O token só é consumido quando setupMfa conclui.
      x-trace: [RF-002, CA-037b, DEC-082]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptMfaResetRequest' }
      responses:
        '200':
          description: Pré-sessão criada para cadastro do novo MFA
          headers:
            Set-Cookie:
              description: Cookies mp_pre_session e mp_csrf
              schema: { type: string }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/LoginThrottled' }

  # ───────────────────────────── admin (RF-001) ─────────────────────────────
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: Lista usuários do tenant
      description: Lista usuários do tenant.
      x-trace: [RF-001]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de usuários
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createTenantUser
      tags: [admin]
      summary: Cria usuário no tenant e envia convite
      description: |
        Cria o usuário (inativo até aceitar o convite), atribui um ou mais perfis (RN-003) e
        vincula aos projetos informados; sem projetos, vincula a todos (RN-004). Envia convite
        de 24 h (DEC-032). E-mail já existente na plataforma → 400 ERR-023, mesma resposta
        para qualquer tenant (DEC-054; DEC-065). Projeto de outro tenant em
        `projetos` → 404 ERR-002.
      x-trace: [RF-001, CA-012, CA-035, RN-003, RN-004, DEC-054]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Usuário criado; convite enviado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}:
    get:
      operationId: getUser
      tags: [admin]
      summary: Consulta usuário
      description: Consulta usuário.
      x-trace: [RF-001, CA-012]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuário
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Atualiza nome, perfis, vínculos ou situação do usuário
      description: |
        Desativar (`ativo: false`) encerra todas as sessões imediatamente. Mudanças de perfil
        e de vínculo são auditadas (RN-027). Desativar ou retirar `admin_tenant` do último
        administrador ativo → ERR-018.
      x-trace: [RF-001, CA-016, RN-003, RN-004]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Usuário atualizado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/invite:
    post:
      operationId: inviteUser
      tags: [admin]
      summary: Reenvia convite a usuário que ainda não aceitou
      description: Gera novo convite de 24 h e invalida o anterior (DEC-032, CA-035).
      x-trace: [RF-001, CA-035, DEC-032]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Convite enviado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/mfa-reset:
    post:
      operationId: resetMfa
      tags: [admin]
      summary: Reseta o MFA do usuário (encerra sessões)
      description: |
        Grava mfa_ativo = false, apaga o segredo TOTP e invalida links de reset anteriores.
        Todas as sessões são encerradas e o usuário recebe por e-mail um link de uso único (24 h)
        para cadastrar o novo MFA via acceptMfaReset (DEC-082). Auditoria: acao=RESET_MFA,
        entidade=Usuario (CA-037b).
      x-trace: [RF-001, CA-037b, DEC-082]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: MFA resetado; sessões encerradas; auditado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/individual-access-grants:
    get:
      operationId: listIndividualAccessGrants
      tags: [admin]
      summary: Lista concessões de acesso individual
      description: Lista concessões de acesso individual.
      x-trace: [RF-001, CA-025]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
        - name: somente_vigentes
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Página de concessões
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: grantIndividualAccess
      tags: [admin]
      summary: Concede acesso individual por 90 dias, com justificativa
      description: |
        Vale enquanto ativo e dentro de `valido_ate` (90 dias, DEC-031). Já existindo concessão
        vigente para o par usuário/projeto, ou usuário sem o perfil `analista` → ERR-018 (CA-025, DEC-080).
      x-trace: [RF-001, CA-025, DEC-031]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantCreate' }
      responses:
        '201':
          description: Concessão criada
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/individual-access-grants/{grantId}:
    delete:
      operationId: revokeAccess
      tags: [admin]
      summary: Revoga concessão de acesso individual (efeito imediato)
      description: Efeito imediato; as sessões do analista são encerradas; ação auditada (CA-038).
      x-trace: [RF-001, CA-038]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/GrantId'
      responses:
        '204': { description: Concessão revogada; sessões encerradas }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── projects (RF-003) ─────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: Lista projetos vinculados ao usuário
      description: Lista projetos vinculados ao usuário.
      x-trace: [RF-003, CA-016]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de projetos
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createProject
      tags: [projects]
      summary: Cria projeto com grupo_minimo
      description: Projeto inicia `ativo`; criação registrada no histórico e na auditoria (CA-027, DEC-055).
      x-trace: [RF-003, CA-027, DEC-055]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Projeto criado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

