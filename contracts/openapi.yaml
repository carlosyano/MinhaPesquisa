openapi: 3.0.3
info:
  title: MinhaPesquisa API
  version: 0.7.0
  description: |
    API da aplicação local MinhaPesquisa (DEC-107) — digitalização de pesquisas em papel com
    leitura por IA, revisão humana e dashboards, em conformidade com a LGPD. Uma única usuária,
    com todas as permissões (DEC-109); servida só em 127.0.0.1 (DEC-113).
    Fonte normativa: REQ v2.7 e PLANO.md v3.18. Contract-first — este arquivo valida
    requisição e resposta (DEC-049). Erros seguem RFC 9457 (Problem Details) com catálogo ERR fechado.
    Segurança: a única rota pública (`login`) declara `security: []`; sem MFA (DEC-108);
    demais rotas exigem sessão, e toda mutação exige também o token CSRF (os dois esquemas no
    mesmo objeto de segurança significam E, não OU).
  contact:
    name: Carlos Yano
servers:
  - url: http://127.0.0.1:8080
    description: Aplicação local no notebook (DEC-113); dados reais só após o GX-001

tags:
  - name: auth
    description: Autenticação por senha local e sessão (RF-002, DEC-108)
  - name: projects
    description: Ciclo de vida e parâmetros de projetos (RF-003)
  - name: forms
    description: Formulários, versões, publicação, PDF e importação de formulário (RF-004, RF-011)
  - name: upload
    description: Upload de imagens, identificação e cota (RF-006, RF-007)
  - name: review
    description: Fila de revisão, conclusão, assinatura, descarte e reabertura (RF-008)
  - name: dashboard
    description: Agregados, grupos e ficha individual (RF-009)
  - name: lgpd
    description: Exportação, direitos do titular e auditoria (RF-010)

security:
  - sessionCookie: []

paths:
  # ───────────────────────────── auth (RF-002) ─────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login com e-mail e senha local
      description: |
        Rota pública. Valida e-mail e senha e cria a sessão plena, sem MFA (DEC-108).
        Falha → ERR-013; 5 falhas em 15 min para o mesmo e-mail, exista ou não a conta →
        ERR-014 (CA-026). Limite de 3 sessões ativas → ERR-021.
      x-trace: [RF-002, CA-026, DEC-108]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessão criada
          headers:
            Set-Cookie:
              description: Cookies mp_session (httpOnly) e mp_csrf
              schema: { type: string }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '409': { $ref: '#/components/responses/SessionLimit' }
        '429': { $ref: '#/components/responses/LoginThrottled' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerra a sessão atual
      description: Invalida a sessão atual em banco (DEC-044).
      x-trace: [RF-002, DEC-044]
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/session:
    get:
      operationId: getCurrentSession
      tags: [auth]
      summary: Dados da sessão atual
      description: Dados da sessão atual da usuária (DEC-109).
      x-trace: [RF-002]
      responses:
        '200':
          description: Sessão ativa
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── admin (RF-001) ─────────────────────────────
  # ───────────────────────────── projects (RF-003) ─────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: Lista projetos vinculados ao usuário
      description: Lista projetos vinculados ao usuário.
      x-trace: [RF-003]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de projetos
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createProject
      tags: [projects]
      summary: Cria projeto
      description: |
        Projeto inicia `ativo`; criação registrada no histórico e na auditoria (CA-027). Objetivo,
        coordenador e período de coleta são opcionais; `coleta_fim` antes de `coleta_inicio` → ERR-001
        (DEC-137, CA-049).
      x-trace: [RF-003, RF-011, CA-027, CA-049, DEC-137]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Projeto criado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Consulta projeto
      description: Consulta projeto.
      x-trace: [RF-003, CA-012]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Projeto
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Atualiza nome, descrição, objetivo, coordenador ou período de coleta
      description: |
        Alteração auditada sem os valores (RN-027); `coleta_fim` antes de `coleta_inicio`, depois de
        aplicada a alteração → ERR-001 (DEC-137, CA-049).
      x-trace: [RF-003, RF-011, RN-008, CA-049, DEC-137]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Projeto atualizado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      tags: [projects]
      summary: Arquiva projeto (reversível)
      description: |
        Novos uploads passam a ser recusados (ERR-001); revisões em andamento continuam;
        relatórios permanecem; histórico registra data, hora e usuário (CA-027, DEC-027).
      x-trace: [RF-003, CA-027, DEC-027]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Projeto arquivado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /projects/{projectId}/unarchive:
    post:
      operationId: unarchiveProject
      tags: [projects]
      summary: Restaura projeto arquivado
      description: Restaura projeto arquivado.
      x-trace: [RF-003, CA-027, DEC-027]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Projeto restaurado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── forms (RF-004) ─────────────────────────────
  /projects/{projectId}/forms:
    get:
      operationId: listForms
      tags: [forms]
      summary: Lista formulários e versões de um projeto
      description: Lista formulários e versões de um projeto.
      x-trace: [RF-004]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de formulários
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms:
    post:
      operationId: createForm
      tags: [forms]
      summary: Cria formulário com a versão 1 em rascunho
      description: |
        Cria formulário com a versão 1 em rascunho, já com os 5 campos obrigatórios da RN-050
        (DEC-135, CA-048). Projeto arquivado → ERR-001 (`campos`: `projeto`, DEC-146). `papel_antigo`
        marca a versão 1 como de papel antigo (DEC-175).
      x-trace: [RF-004, RF-011, RF-013, RN-050, CA-048, DEC-135, DEC-146, DEC-175]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormCreate' }
      responses:
        '201':
          description: Formulário criado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms/{formId}/versions:
    post:
      operationId: createVersion
      tags: [forms]
      summary: Cria nova versão em rascunho (opcionalmente copiando outra)
      description: |
        Alterações em versão publicada sempre criam nova versão (RN-042, CA-001). Sem
        `copiar_de_versao_id`, a versão nasce com os 5 campos da RN-050; com ele, copia as perguntas
        da origem, padroniza as dos 5 campos, injeta as que faltarem e dá sufixo a código reservado
        em pergunta comum (RN-050, DEC-145, DEC-147, CA-048). Quando a versão nova não é de papel
        antigo, a marca `nao_consta` é retirada das perguntas copiadas (DEC-179) e o `total_paginas`
        informado é apagado; quando é, ele é copiado (DEC-189).
      x-trace: [RF-004, RF-011, RF-013, CA-001, RN-042, RN-050, CA-048, DEC-147, DEC-179, DEC-189]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCreate' }
      responses:
        '201':
          description: Versão em rascunho criada
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms/{formId}/versions/{versionId}:
    get:
      operationId: getVersion
      tags: [forms]
      summary: Consulta versão completa (perguntas, opções e regras de salto)
      description: Consulta versão completa (perguntas, opções e regras de salto).
      x-trace: [RF-004]
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Versão
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      operationId: updateVersion
      tags: [forms]
      summary: Substitui o conteúdo de uma versão em rascunho
      description: |
        Versão publicada é imutável → ERR-009 (CA-001, TS-006). Regra de salto inválida
        (DEC-095), sensibilidade `identificacao` fora das perguntas da RN-047 (DEC-097), falta ou
        repetição de uma marcação da RN-050, código da RN-050 sem a marcação, ou pergunta que não
        cabe na página (DEC-143; não vale no papel antigo, DEC-181) → ERR-001, com os códigos em `campos`.
        `nao_consta` fora do papel antigo ou das perguntas de CPF, data de nascimento, data e local,
        ou desmarcar `papel_antigo` com perguntas `nao_consta` → ERR-001 (DEC-179, CA-057). Código, tipo,
        obrigatoriedade e sensibilidade das perguntas da RN-050 são reaplicados pelo sistema (DEC-145).
        `total_paginas` fora do papel antigo ou menor que a maior página das perguntas → ERR-001; desmarcar
        `papel_antigo` o apaga (ENT-006, DEC-181).
      x-trace: [RF-004, RF-011, RF-013, CA-001, CA-015, RN-042, TS-006, RN-021, DEC-095, DEC-097, RN-050, CA-048, CA-057, CA-058, DEC-143, DEC-145, DEC-179, DEC-181]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionContent' }
      responses:
        '200':
          description: Rascunho atualizado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionImmutable' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms/{formId}/versions/{versionId}/publish:
    post:
      operationId: publishVersion
      tags: [forms]
      summary: Publica versão (exige os campos obrigatórios)
      description: |
        Exige perguntas marcadas como nome, data de nascimento, CPF (tipo `cpf`), data e local
        da aplicação (RN-017); sem elas → ERR-036 (CA-036). Matriz sem linhas ou múltipla escolha
        sem `nenhuma_das_anteriores` (RN-047; não exigida no papel antigo, DEC-195) → ERR-036 com os
        códigos das perguntas em `campos` (DEC-096). Pergunta que não cabe na sua página → ERR-036 com os códigos em `campos`
        (DEC-143), exceto no papel antigo (DEC-181). Grava o mapa de layout (DEC-048), exceto no papel
        antigo, e `total_paginas` (ENT-006).
      x-trace: [RF-004, CA-036, RN-017, RN-047, DEC-048, DEC-096, RF-011, RF-013, DEC-143, DEC-181]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Versão publicada
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '400': { $ref: '#/components/responses/MissingPublishFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionImmutable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms/{formId}/versions/{versionId}/pdf:
    get:
      operationId: generatePdf
      tags: [forms]
      summary: Gera PDF imprimível com QR e marcadores por página
      description: |
        Cada página traz QR com identificador opaco da versão e número da página, e marcadores
        fiduciais (DEC-048). A página 1 traz o termo de consentimento do tenant
        (`termo_consentimento`, DEC-094) com campo de assinatura.
        Versão em rascunho ou de papel antigo não gera PDF → ERR-018 (CA-028, CA-052, DEC-175).
      x-trace: [RF-004, RF-013, CA-028, CA-052, DEC-005, DEC-048, DEC-094, DEC-175]
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: PDF gerado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── importação de formulário (RF-011) ─────────────────────────────
  /projects/{projectId}/form-imports:
    get:
      operationId: listFormImports
      tags: [forms]
      summary: Lista as importações do projeto, da mais recente para a mais antiga
      description: Importações do projeto em qualquer estado da FL-004 (TL-015).
      x-trace: [RF-011, CA-045, CA-047]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de importações
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormImportList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: importForm
      tags: [forms]
      summary: Importa um formulário existente (job assíncrono)
      description: |
        Recebe um formulário em branco ou com dados fictícios (DEC-133) e enfileira a leitura da
        estrutura pela IA (RN-049, FL-004); com `papel_antigo`, cada pergunta fica na página do
        original (DEC-181). Projeto arquivado (`campos`: `projeto`, DEC-146) ou
        sem `sem_dados_reais` = true (`campos`: `sem_dados_reais`) → 400 ERR-001; arquivo fora
        dos limites → 400 ERR-029 com o motivo (DEC-136). O resultado, um formulário novo com a
        versão 1 em rascunho, é consultado em `getFormImport`.
      x-trace: [RF-011, CA-045, CA-046, CA-047, RN-049, RN-050, DEC-132, DEC-133, DEC-136, DEC-146, RF-013, CA-058, DEC-181, DEC-190]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FormImportRequest' }
      responses:
        '202':
          description: Importação enfileirada
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormImport' }
        '400': { $ref: '#/components/responses/FileRejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
