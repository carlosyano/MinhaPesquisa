        '201':
          description: Pedido registrado (pendente)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /data-subject-requests/{requestId}:
    get:
      operationId: getDataSubjectRequest
      tags: [lgpd]
      summary: Consulta pedido do titular (com link do resultado para acesso/portabilidade)
      description: Consulta pedido do titular (com link do resultado para acesso/portabilidade).
      x-trace: [RF-010, CA-024]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Pedido
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /data-subject-requests/{requestId}/execute:
    post:
      operationId: executeDataSubjectRequest
      tags: [lgpd]
      summary: Executa o pedido do titular (job assíncrono)
      description: |
        Eliminação: bloqueio imediato, anonimização (nome, CPF, data de nascimento e endereço),
        sobrescrita das respostas, expurgo de imagens e exportações, descarte das aplicações em
        andamento e registro na ListaEliminacoes por 180 dias (CA-023, DEC-026). Acesso e
        portabilidade geram CSV ou JSON (CA-024). Pedido em `falhou` pode ser executado de
        novo; já concluído ou cancelado → ERR-018.
      x-trace: [RF-010, CA-023, CA-024, DEC-026]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Execução iniciada (em_andamento)
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /data-subject-requests/{requestId}/cancel:
    post:
      operationId: cancelDataSubjectRequest
      tags: [lgpd]
      summary: Cancela pedido do titular pendente ou com falha (FL-003)
      x-trace: [RF-010, RN-031]
      description: Cancelamento com motivo, auditado; em `em_andamento`, `concluido` ou `cancelado` → ERR-018.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Pedido cancelado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [lgpd]
      summary: Consulta a trilha de auditoria do tenant (TL-011)
      description: Só referências, nunca valores pessoais (RN-027).
      x-trace: [RF-010, RN-027]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
        - { name: acao, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: entidade, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: de, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: ate, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Página de eventos
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mp_session
      description: Sessão plena em banco; cookie httpOnly, Secure, SameSite=Lax (DEC-044).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token CSRF (double-submit com o cookie mp_csrf) em toda mutação autenticada.

  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectIdQuery: { name: projeto_id, in: query, required: true, schema: { type: string, format: uuid } }
    FormId: { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    GroupId: { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    RespondentId: { name: respondentId, in: path, required: true, schema: { type: string, format: uuid } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    RequestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    PageId: { name: pageId, in: path, required: true, schema: { type: string, format: uuid } }
    Pagina: { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    Limite: { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave de idempotência obrigatória nas mutações críticas (P.8, REQ §6.5); reuso com outro conteúdo → ERR-019.
      schema: { type: string, minLength: 16, maxLength: 64 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag obtido na leitura; divergente → ERR-017 (P.8).
      schema: { type: string }

  headers:
    CorrelationId:
      description: Identificador de correlação da requisição
      schema: { type: string }
    ETag:
      description: Versão do recurso para If-Match
      schema: { type: string }

  responses:
    BadRequest:
      description: Validação falhou (ERR-001)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-001', title: Erro de validação, status: 400, detail: Revise os campos destacados e tente novamente., errorCode: ERR-001, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    InvalidCredentials:
      description: Credenciais inválidas (ERR-013), mesma resposta exista ou não a conta
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-013', title: Credenciais inválidas, status: 401, detail: Credenciais inválidas., errorCode: ERR-013, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    LoginThrottled:
      description: Bloqueio por tentativas (ERR-014) ou limite geral (ERR-010)
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
        Retry-After: { description: Segundos a aguardar, schema: { type: integer } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-014', title: Muitas tentativas, status: 429, detail: Muitas tentativas. Tente novamente em 15 minutos., errorCode: ERR-014, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    Unauthorized:
      description: Sessão ausente, expirada ou encerrada (ERR-015)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-015', title: Sessão expirada, status: 401, detail: Sua sessão expirou. Entre novamente., errorCode: ERR-015, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    Forbidden:
      description: Token CSRF ausente ou inválido (ERR-016)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-016', title: Sem permissão, status: 403, detail: Você não tem permissão para realizar esta ação., errorCode: ERR-016, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    NotFound:
      description: Recurso inexistente ou de outro tenant (ERR-002) — nunca revela existência
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-002', title: Não encontrado, status: 404, detail: O recurso solicitado não existe ou você não tem acesso., errorCode: ERR-002, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    InvalidState:
      description: Ação não permitida no estado atual (ERR-018) ou chave de idempotência reutilizada (ERR-019)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-018', title: Estado inválido, status: 409, detail: Esta ação não é permitida no estado atual., errorCode: ERR-018, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    IdempotencyConflict:
      description: Chave de idempotência reutilizada com outro conteúdo (ERR-019)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-019', title: Requisição duplicada, status: 409, detail: Esta solicitação já foi enviada com outros dados. Gere uma nova solicitação., errorCode: ERR-019, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    VersionImmutable:
      description: Versão publicada é imutável (ERR-009)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-009', title: Versão imutável, status: 409, detail: Versões publicadas são imutáveis. Crie uma nova versão em rascunho., errorCode: ERR-009, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    PreconditionFailed:
      description: ETag divergente (ERR-017)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-017', title: Edição concorrente, status: 412, detail: Os dados foram alterados por outra pessoa. Recarregue e tente novamente., errorCode: ERR-017, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    TooManyRequests:
      description: Limite de requisições excedido (ERR-010)
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
        Retry-After: { description: Segundos a aguardar, schema: { type: integer } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-010', title: Muitas tentativas, status: 429, detail: Muitas tentativas. Aguarde alguns minutos antes de tentar novamente., errorCode: ERR-010, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    MissingMandatoryFields:
      description: Item não resolvido (ERR-022) ou campos obrigatórios da DEC-020 ausentes (ERR-006)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-006', title: Campos obrigatórios ausentes, status: 400, detail: 'A aplicação não pode ser concluída sem nome, data de nascimento, CPF válido, data e local da aplicação.', errorCode: ERR-006, correlationId: 3f1c2b9e-0000-4000-8000-000000000001, campos: [local_aplicacao] }
    MissingPublishFields:
      description: Publicação sem campos obrigatórios (ERR-036)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-036', title: Campos obrigatórios ausentes, status: 400, detail: 'Publicação recusada: faltam [lista dos campos].', errorCode: ERR-036, correlationId: 3f1c2b9e-0000-4000-8000-000000000001, campos: [data_aplicacao] }
    FileRejected:
      description: Arquivo recusado (ERR-029, com motivo) ou projeto arquivado (ERR-001)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-029', title: Arquivo recusado, status: 400, detail: 'Arquivo recusado: [motivo].', errorCode: ERR-029, correlationId: 3f1c2b9e-0000-4000-8000-000000000001, motivo: excede o limite de 20 MB }
    QrInvalid:
      description: Identificação ainda inválida (ERR-004 ou ERR-039)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-039', title: QR inválido, status: 400, detail: QR code inválido para o contexto atual. Informe manualmente., errorCode: ERR-039, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    SessionLimit:
      description: Limite de 3 sessões ativas (ERR-021)
      headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-021', title: Limite de sessões, status: 409, detail: Você já tem 3 sessões ativas. Saia em outro dispositivo ou aguarde até 30 minutos sem uso para entrar., errorCode: ERR-021, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }
    ServiceUnavailable:
      description: Dependência indisponível após retentativas (ERR-020)
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
        Retry-After: { description: Segundos a aguardar, schema: { type: integer } }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - example: { type: 'https://api.minhapesquisa.example.com.br/errors/ERR-020', title: Serviço indisponível, status: 503, detail: Serviço temporariamente indisponível. Tente novamente em instantes., errorCode: ERR-020, correlationId: 3f1c2b9e-0000-4000-8000-000000000001 }

  schemas:
    ProblemDetails:
      type: object
      description: |
        Problem Details (RFC 9457). Nunca expõe stack trace nem detalhe interno. Extensões
        permitidas: `campos` (ERR-001, ERR-006, ERR-036) e `motivo` (ERR-029).
      required: [type, title, status, detail, errorCode, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: 'Mensagem exata do catálogo, em pt-BR' }
        instance: { type: string }
        correlationId: { type: string, description: Espelha X-Correlation-ID }
        errorCode: { $ref: '#/components/schemas/ErrorCode' }
        campos: { type: array, items: { type: string } }
        motivo:
          type: string
          enum: [excede o limite de 20 MB, excede o limite de 50 páginas, tipo de arquivo não permitido, risco de segurança detectado]

    ErrorCode:
      type: string
      description: Catálogo fechado de erros ativos (REQ §8.2)
      enum: [ERR-001, ERR-002, ERR-003, ERR-004, ERR-006, ERR-009, ERR-010, ERR-013, ERR-014, ERR-015, ERR-016, ERR-017, ERR-018, ERR-019, ERR-020, ERR-021, ERR-022, ERR-029, ERR-036, ERR-039, ERR-041]

    ApplicationState:
      type: string
      description: FL-001 / ENT-010.estado
      enum: [identificacao_pendente, aguardando_cota, em_leitura, erro_leitura, em_revisao, aguardando_cpf, sem_assinatura, concluida, descartada]

    ItemState:
      type: string
      description: FL-002 / ENT-011.estado
      enum: [pendente_leitura, aguardando_condicao, confirmado_automaticamente, a_revisar, confirmado, corrigido, em_branco, ilegivel, rasurado, nao_se_aplica]

    PageMeta:
      type: object
      additionalProperties: false
      required: [pagina, limite, total]
      properties:
        pagina: { type: integer, minimum: 1 }
        limite: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, senha]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        senha: { type: string, format: password, minLength: 10, maxLength: 72 }

    SessionInfo:
      type: object
      additionalProperties: false
      required: [usuario_id, nome, expira_em]
      properties:
        usuario_id: { type: string, format: uuid }
        nome: { type: string }
        expira_em: { type: string, format: date-time }

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [nome]
      properties:
        nome: { type: string, minLength: 1, maxLength: 200 }
        descricao: { type: string, maxLength: 5000 }

    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      x-todos-opcionais: true
      properties:
        nome: { type: string, minLength: 1, maxLength: 200 }
        descricao: { type: string, maxLength: 5000 }

    Project:
      type: object
      additionalProperties: false
      required: [id, nome, status, criado_em]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        descricao: { type: string, nullable: true }
        status: { type: string, enum: [ativo, arquivado] }
        criado_em: { type: string, format: date-time }

    ProjectList:
      type: object
      additionalProperties: false
      required: [itens, meta]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Project' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    FormCreate:
      type: object
      additionalProperties: false
      required: [nome, projeto_id]
      properties:
        nome: { type: string, minLength: 1, maxLength: 200 }
        projeto_id: { type: string, format: uuid }

    FormSummary:
      type: object
      additionalProperties: false
      required: [id, nome, projeto_id, criado_em, versoes]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        projeto_id: { type: string, format: uuid }
        criado_em: { type: string, format: date-time }
        versoes: { type: array, items: { $ref: '#/components/schemas/VersionSummary' } }

    FormList:
      type: object
      additionalProperties: false
      required: [itens, meta]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/FormSummary' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    Question:
      type: object
      additionalProperties: false
      required: [codigo, tipo, enunciado, ordem, pagina]
      properties:
        codigo: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 100 }
        tipo: { type: string, enum: [escolha_unica, multipla_escolha, escala, matriz, numero, data, sim_nao, cpf, texto_curto, texto_livre] }
        enunciado: { type: string, maxLength: 2000 }
        ordem: { type: integer, minimum: 1 }
        pagina: { type: integer, minimum: 1 }
        obrigatorio: { type: boolean, default: false }
        campo_respondente: { type: string, enum: [nome, data_nascimento, cpf, endereco], nullable: true }
        campo_aplicacao: { type: string, enum: [data_aplicacao, local_aplicacao, aplicador], nullable: true, description: Marca as perguntas de data e local exigidas pela RN-017 }
        sensibilidade: { type: string, enum: [identificacao, saude, outro], default: saude, description: 'Grupo de envio à IA (RN-039); forçado a identificacao quando há campo_respondente ou campo_aplicacao = aplicador (RN-047); nas demais perguntas só saude ou outro (DEC-097)' }
        linhas:
          type: array
          description: Obrigatório para tipo matriz (RN-047)
          items:
            type: object
            additionalProperties: false
            required: [codigo, rotulo, ordem]
            properties:
              codigo: { type: string, pattern: '^[a-z0-9_]+$', maxLength: 50 }
              rotulo: { type: string, maxLength: 200 }
              ordem: { type: integer, minimum: 1 }
        valor_min: { type: number, nullable: true }
        valor_max: { type: number, nullable: true }
        unidade: { type: string, maxLength: 20, nullable: true }
        opcoes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [codigo, rotulo, ordem]
            properties:
              codigo: { type: string, pattern: '^[a-z0-9_]+$', maxLength: 50 }
              rotulo: { type: string, maxLength: 200 }
              ordem: { type: integer, minimum: 1 }

    SkipRule:
      type: object
      additionalProperties: false
      required: [pergunta_origem_codigo, pergunta_destino_codigo, opcao_codigo]
      properties:
        pergunta_origem_codigo: { type: string, pattern: '^[A-Z0-9_]+$' }
        pergunta_destino_codigo: { type: string, pattern: '^[A-Z0-9_]+$' }
        opcao_codigo: { type: string, pattern: '^[a-z0-9_]+$' }

    VersionContent:
      type: object
      additionalProperties: false
      required: [perguntas, regras_salto]
      properties:
        perguntas: { type: array, items: { $ref: '#/components/schemas/Question' } }
        regras_salto: { type: array, items: { $ref: '#/components/schemas/SkipRule' } }

    VersionCreate:
      type: object
      additionalProperties: false
      x-todos-opcionais: true
      properties:
        copiar_de_versao_id: { type: string, format: uuid, description: Ausente = versão vazia }

    VersionSummary:
      type: object
      additionalProperties: false
      required: [id, formulario_id, numero, status, criada_em]
      properties:
        id: { type: string, format: uuid }
        formulario_id: { type: string, format: uuid }
        numero: { type: integer, minimum: 1 }
        status: { type: string, enum: [rascunho, publicada] }
        publicada_em: { type: string, format: date-time, nullable: true }
        criada_em: { type: string, format: date-time }

    Version:
      type: object
      additionalProperties: false
      required: [resumo, conteudo]
      properties:
        resumo: { $ref: '#/components/schemas/VersionSummary' }
        conteudo: { $ref: '#/components/schemas/VersionContent' }

    UploadRequest:
      type: object
      additionalProperties: false
      required: [arquivos]
      properties:
        arquivos:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: binary }
          description: JPEG/PNG/PDF, até 20 MB e 50 páginas por arquivo; todos da mesma pessoa (DEC-008); o total de páginas não pode passar o da versão (CA-040)

    UploadResponse:
      type: object
      additionalProperties: false
      required: [aplicacao_id, estado, paginas]
      properties:
        aplicacao_id: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/ApplicationState' }
        paginas: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PageRef' } }
        aviso:
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          nullable: true
          description: ERR-004, ERR-039 ou ERR-003 quando o estado inicial não é em_leitura

    IdentifyRequest:
      type: object
      additionalProperties: false
      description: Toda imagem do tipo formulario da aplicação deve constar uma vez; ausente, repetida ou com número repetido → 400 ERR-004
      required: [versao_id, paginas]
      properties:
        versao_id: { type: string, format: uuid }
        paginas:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [imagem_id]
            properties:
              imagem_id: { type: string, format: uuid }
              numero_pagina: { type: integer, minimum: 1, description: Obrigatório quando descartar = false }
              descartar: { type: boolean, default: false, description: Remove a imagem (página repetida ou de outro formulário) }

    QuotaStatus:
      type: object
      additionalProperties: false
      required: [teto, consumido, periodo_inicio, periodo_fim, atingido, aplicacoes_aguardando]
      properties:
        teto: { type: string, pattern: '^[0-9]+\.[0-9]{2}$', description: Valor em reais (decimal exato) }
        consumido: { type: string, pattern: '^[0-9]+\.[0-9]{2}$' }
        periodo_inicio: { type: string, format: date }
        periodo_fim: { type: string, format: date }
        atingido: { type: boolean }
        aplicacoes_aguardando: { type: integer, minimum: 0 }

    Application:
      type: object
      additionalProperties: false
      required: [id, projeto_id, estado, assinatura, itens]
      properties:
        id: { type: string, format: uuid }
        projeto_id: { type: string, format: uuid }
        versao_id: { type: string, format: uuid, nullable: true }
        estado: { $ref: '#/components/schemas/ApplicationState' }
        assinatura: { type: string, enum: [presente, ausente, nao_conferida] }
        aviso:
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          nullable: true
        divergencias_cadastro:
          type: array
          description: Atributos em que o valor lido difere do cadastro existente (CA-014), calculado quando o item de CPF fica resolvido
          items: { type: string, enum: [nome, data_nascimento, endereco] }
        paginas: { type: array, items: { $ref: '#/components/schemas/PageRef' } }
        cadastro_existente:
          type: object
          nullable: true
          additionalProperties: false
          description: Valores atuais do respondente com o mesmo CPF, só depois de openReview, com auditoria (CA-014); CPF não é devolvido
          properties:
            nome: { type: string, nullable: true }
            data_nascimento: { type: string, format: date, nullable: true }
            endereco: { type: string, nullable: true }
        itens: { type: array, items: { $ref: '#/components/schemas/ReviewItem' } }

    PageRef:
      type: object
      additionalProperties: false
      required: [imagem_id, tipo, registro_ok]
      properties:
        imagem_id: { type: string, format: uuid }
        numero_pagina: { type: integer, minimum: 1, nullable: true }
        tipo: { type: string, enum: [formulario, assinatura] }
        registro_ok: { type: boolean }

    PageImage:
      type: object
      additionalProperties: false
      required: [url, expira_em]
      properties:
        url: { type: string, format: uri, description: Link assinado de 5 min da página inteira (DEC-034) }
        expira_em: { type: string, format: date-time }
        regiao_assinatura:
          type: object
          nullable: true
          additionalProperties: false
          required: [x, y, largura, altura]
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
            largura: { type: number, minimum: 0, maximum: 1 }
            altura: { type: number, minimum: 0, maximum: 1 }

    ApplicationList:
      type: object
      additionalProperties: false
      required: [itens, meta]
      properties:
        itens:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, estado, criada_em]
            properties:
              id: { type: string, format: uuid }
              estado: { $ref: '#/components/schemas/ApplicationState' }
              criada_em: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ReviewItem:
      type: object
      additionalProperties: false
      required: [id, pergunta_codigo, estado]
      properties:
        id: { type: string, format: uuid }
        pergunta_codigo: { type: string }
        linha_codigo: { type: string, nullable: true, description: Linha da matriz (RN-009) }
        valor_ia: { type: string, nullable: true, description: 'Formato canônico (REQ §5.4); CPF mascarado salvo depois de openReview (RN-013)' }
        confianca: { type: number, minimum: 0, maximum: 1, nullable: true, description: Valor bruto (até 4 casas) }
        valor_final: { type: string, nullable: true }
        estado: { $ref: '#/components/schemas/ItemState' }

    ItemImage:
      type: object
      additionalProperties: false
      required: [url, expira_em]
      properties:
        url: { type: string, format: uri, description: Link assinado de 5 min do recorte do campo (DEC-034) }
        expira_em: { type: string, format: date-time }
        regiao:
          type: object
          additionalProperties: false
          required: [x, y, largura, altura]
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
            largura: { type: number, minimum: 0, maximum: 1 }
            altura: { type: number, minimum: 0, maximum: 1 }

    ReviewPatch:
      type: object
      additionalProperties: false
      required: [itens]
      properties:
        itens:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [item_id, acao]
            properties:
              item_id: { type: string, format: uuid }
              acao: { type: string, enum: [confirmar, corrigir, em_branco, ilegivel, rasurado, nao_se_aplica] }
              valor_final: { type: string, maxLength: 2000, nullable: true, description: Obrigatório quando acao = corrigir }

    ConfirmApplicationRequest:
      type: object
      additionalProperties: false
      required: [assinatura]
      properties:
        assinatura: { type: string, enum: [presente, ausente] }
        manter_cadastro:
          type: object
          additionalProperties: false
          description: Escolha do digitalizador para cada atributo listado em divergencias_cadastro (CA-014); obrigatória para todos eles, senão 400 ERR-001
          properties:
            nome: { type: string, enum: [existente, aplicacao] }
            data_nascimento: { type: string, enum: [existente, aplicacao] }
            endereco: { type: string, enum: [existente, aplicacao] }

    SignatureUpload:
      type: object
      additionalProperties: false
      required: [arquivo, assinatura]
      properties:
        arquivo: { type: string, format: binary, description: Imagem da página 1 assinada (JPEG/PNG/PDF) }
        assinatura: { type: string, enum: [presente], description: Confirmação humana da conferência (RN-044) }

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 3, maxLength: 2000 }

    Filter:
      type: object
      additionalProperties: false
      required: [tipo, operador, valores]
      description: |
        Faixas fixas de idade como formato de filtro; sem regra de anonimização (DEC-110).
        tipo `idade`: faixa de idade na data da aplicação mais recente do período (CA-009); `valores` são faixas fixas.
        tipo `resposta`: em `escala`, só `igual` ou `diferente` com um valor (DEC-075); em `multipla_escolha`, significa "marcou a opção".
        tipo `resposta`: códigos de opção do valor final de `pergunta_codigo` (só perguntas categóricas: escolha_unica, multipla_escolha, sim_nao, escala, matriz com `linha_codigo`) na aplicação mais recente do período que contenha a pergunta (CA-031). Outro tipo → 400 ERR-001.
      properties:
        tipo: { type: string, enum: [idade, resposta] }
        pergunta_codigo: { type: string, pattern: '^[A-Z0-9_]+$', description: Obrigatório quando tipo = resposta }
        linha_codigo: { type: string, pattern: '^[a-z0-9_]+$', nullable: true, description: Obrigatório para pergunta do tipo matriz }
        operador: { type: string, enum: [igual, diferente, em] }
        valores:
          type: array
          minItems: 1
          maxItems: 50
          description: 'idade: faixas <60, 60-64, 65-69, 70-74, 75-79, 80-84, 85-89, 90+; resposta: códigos de opção'
          items: { type: string, maxLength: 50 }

    Period:
      type: object
      additionalProperties: false
      required: [de, ate]
      properties:
        de: { type: string, format: date }
        ate: { type: string, format: date }

    DashboardQuery:
      type: object
      additionalProperties: false
      required: [projeto_ids, pergunta_codigo]
      properties:
        projeto_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
        pergunta_codigo: { type: string, pattern: '^[A-Z0-9_]+$' }
        cruzamento_codigo: { type: string, pattern: '^[A-Z0-9_]+$', nullable: true }
        filtros: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Filter' } }
        grupo_id: { type: string, format: uuid, nullable: true }
        periodo: { $ref: '#/components/schemas/Period' }

    AggregatedResult:
      type: object
      additionalProperties: false
      required: [celulas]
      properties:
        celulas:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [opcao, respondentes]
            properties:
              opcao: { type: string }
              cruzamento: { type: string, nullable: true }
              respondentes: { type: integer, minimum: 0 }

    GroupCreate:
      type: object
      additionalProperties: false
      required: [nome, projeto_id, filtros]
      properties:
        nome: { type: string, minLength: 1, maxLength: 200 }
        projeto_id: { type: string, format: uuid }
        filtros: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Filter' } }
        periodo: { $ref: '#/components/schemas/Period' }

    Group:
      type: object
      additionalProperties: false
      required: [id, nome, projeto_id, filtros, criado_em]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        projeto_id: { type: string, format: uuid }
        filtros: { type: array, items: { $ref: '#/components/schemas/Filter' } }
        periodo: { $ref: '#/components/schemas/Period' }
        criado_em: { type: string, format: date-time }

    GroupList:
      type: object
      additionalProperties: false
      required: [itens, meta]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Group' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    RespondentSearch:
      type: object
      additionalProperties: false
      required: [cpf]
      properties:
        cpf: { type: string, pattern: '^[0-9]{11}$' }

    RespondentRef:
      type: object
      additionalProperties: false
      required: [respondente_id]
      properties:
        respondente_id: { type: string, format: uuid }

    IndividualRecord:
      type: object
      additionalProperties: false
      required: [respondente_id, evolucao]
      properties:
        respondente_id: { type: string, format: uuid }
        evolucao:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pergunta_codigo, data_aplicacao, projeto_id]
            properties:
              pergunta_codigo: { type: string }
              data_aplicacao: { type: string, format: date }
              valor: { type: string, nullable: true }
              projeto_id: { type: string, format: uuid }

    ExportRequest:
      type: object
      additionalProperties: false
      required: [formato, escopo, projeto_ids]
      properties:
        formato: { type: string, enum: [csv, xlsx] }
        escopo: { type: string, enum: [agregado, linha_a_linha] }
        projeto_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
        filtros: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Filter' } }
        periodo: { $ref: '#/components/schemas/Period' }
        rotulos: { type: string, enum: [codigos, rotulos], default: rotulos }

    ExportStatus:
      type: object
      additionalProperties: false
      required: [id, status, criado_em]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [enfileirada, em_andamento, concluida, falhou, cancelada] }
        criado_em: { type: string, format: date-time }
        url_download: { type: string, format: uri, nullable: true, description: 'Link assinado de 5 min, só quando concluida' }
        expira_em: { type: string, format: date-time, nullable: true }

    DataSubjectRequestCreate:
      type: object
      additionalProperties: false
      required: [cpf, tipo]
      properties:
        cpf: { type: string, pattern: '^[0-9]{11}$' }
        tipo: { type: string, enum: [acesso, correcao, eliminacao, portabilidade] }
        descricao: { type: string, maxLength: 2000, description: Não incluir dado pessoal; sobrescrita na eliminação }
        correcoes:
          type: array
          description: Obrigatório quando tipo = correcao (FL-003)
          items:
            type: object
            additionalProperties: false
            required: [atributo, valor]
            properties:
              atributo: { type: string, enum: [nome, data_nascimento, endereco] }
              valor: { type: string, maxLength: 500 }

    DataSubjectRequest:
      type: object
      additionalProperties: false
      required: [id, tipo, status, solicitado_em]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [acesso, correcao, eliminacao, portabilidade] }
        status: { type: string, enum: [pendente, em_andamento, concluido, falhou, cancelado] }
        solicitado_em: { type: string, format: date-time }
        executado_em: { type: string, format: date-time, nullable: true }
        url_resultado: { type: string, format: uri, nullable: true, description: 'Acesso/portabilidade (CSV ou JSON), link assinado de 5 min' }

    DataSubjectRequestList:
      type: object
      additionalProperties: false
      required: [itens, meta]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/DataSubjectRequest' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, acao, entidade, criado_em]
      properties:
        id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid, nullable: true }
        acao: { type: string }
        entidade: { type: string }
        registro_id: { type: string, format: uuid, nullable: true }
        campo: { type: string, nullable: true }
        canal: { type: string, enum: [web, api, script], nullable: true }
        criado_em: { type: string, format: date-time }

    AuditEventList:
      type: object
      additionalProperties: false
      required: [itens, meta]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
