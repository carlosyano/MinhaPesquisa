  /data-subject-requests/{requestId}/execute:
    post:
      operationId: executeDataSubjectRequest
      tags: [lgpd]
      summary: Executa o pedido do titular (job assíncrono)
      description: |
        Eliminação: bloqueio imediato, anonimização (nome, CPF, data de nascimento e endereço),
        sobrescrita das respostas, expurgo de imagens e exportações, descarte das aplicações em
        andamento e registro na ListaEliminacoes por 180 dias (CA-023, DEC-026). Acesso e
        portabilidade geram CSV ou JSON (CA-024). Pedido em `falhou` pode ser executado de
        novo; já concluído ou cancelado → ERR-018. Na eliminação de respondente sem CPF, as aplicações
        de papel antigo em andamento de mesmo nome não são descartadas sozinhas: ficam listadas em
        `aplicacoes_mesmo_nome` para a usuária decidir, e a lista fica gravada no pedido (DEC-191, DEC-193).
      x-trace: [RF-010, CA-023, CA-024, CA-056, DEC-026, DEC-191, DEC-193]
      security:
        - sessionCookie: []
