      tags: [lgpd]
      summary: Gera exportação CSV/XLSX (job assíncrono)
      description: |
        Agregada, linha a linha ou linha por item (formato longo, RN-051), sem k-anonimato
        (DEC-109, DEC-110); toda exportação é auditada (CA-022). O arquivo é apagado após
        `retencao_exportacao_dias` (RN-030). Sem assinatura fica fora (CA-021), exceto papel antigo (DEC-172). No CSV, células de
        texto que começam com `=`, `+`, `-`, `@`, tabulação ou retorno de carro recebem um
        apóstrofo; no XLSX saem como estão, em célula de texto, nunca como fórmula (DEC-166). Com `linha_por_item`, `filtros` → ERR-001 (DEC-163) e `rotulos` é ignorado
        (a planilha traz código e rótulo).
      x-trace: [RF-010, RF-012, RN-051, CA-021, CA-022, CA-050, CA-051, CA-054, DEC-014, DEC-109, DEC-110, DEC-153, DEC-163, DEC-166, DEC-172]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '202':
          description: Exportação enfileirada
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
