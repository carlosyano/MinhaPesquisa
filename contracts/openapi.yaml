openapi: 3.0.3
info:
  title: MinhaPesquisa API
  version: 0.3.0
  description: |
    API da aplicação local MinhaPesquisa (DEC-107) — digitalização de pesquisas em papel com
    leitura por IA, revisão humana e dashboards, em conformidade com a LGPD. Uma única usuária,
    com todas as permissões (DEC-109); servida só em 127.0.0.1 (DEC-113).
    Fonte normativa: REQ v2.2 e PLANO.md v3.7. Contract-first — este arquivo valida
    requisição e resposta (DEC-049). Erros seguem RFC 9457 (Problem Details) com catálogo ERR fechado.
    Segurança: a única rota pública (`login`) declara `security: []`; sem MFA (DEC-108);
    demais rotas exigem sessão, e toda mutação exige também o token CSRF (os dois esquemas no
    mesmo objeto de segurança significam E, não OU).
  contact:
    name: Carlos Yano
servers:
  - url: http://127.0.0.1:8080
    description: Aplicação local no notebook (DEC-113); dados reais só após o GX-001

tags:
  - name: auth
    description: Autenticação por senha local e sessão (RF-002, DEC-108)
  - name: projects
    description: Ciclo de vida e parâmetros de projetos (RF-003)
  - name: forms
    description: Formulários, versões, publicação e PDF (RF-004)
  - name: upload
    description: Upload de imagens, identificação e cota (RF-006, RF-007)
  - name: review
    description: Fila de revisão, conclusão, assinatura, descarte e reabertura (RF-008)
  - name: dashboard
    description: Agregados, grupos e ficha individual (RF-009)
  - name: lgpd
    description: Exportação, direitos do titular e auditoria (RF-010)

security:
  - sessionCookie: []

paths:
  # ───────────────────────────── auth (RF-002) ─────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login com e-mail e senha local
      description: |
        Rota pública. Valida e-mail e senha e cria a sessão plena, sem MFA (DEC-108).
        Falha → ERR-013; 5 falhas em 15 min para o mesmo e-mail, exista ou não a conta →
        ERR-014 (CA-026). Limite de 3 sessões ativas → ERR-021.
      x-trace: [RF-002, CA-026, DEC-108]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessão criada
          headers:
            Set-Cookie:
              description: Cookies mp_session (httpOnly) e mp_csrf
              schema: { type: string }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '409': { $ref: '#/components/responses/SessionLimit' }
        '429': { $ref: '#/components/responses/LoginThrottled' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerra a sessão atual
      description: Invalida a sessão atual em banco (DEC-044).
      x-trace: [RF-002, DEC-044]
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/session:
    get:
      operationId: getCurrentSession
      tags: [auth]
      summary: Dados da sessão atual
      description: Dados da sessão atual da usuária (DEC-109).
      x-trace: [RF-002]
      responses:
        '200':
          description: Sessão ativa
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── admin (RF-001) ─────────────────────────────
  # ───────────────────────────── projects (RF-003) ─────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: Lista projetos vinculados ao usuário
      description: Lista projetos vinculados ao usuário.
      x-trace: [RF-003]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de projetos
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createProject
      tags: [projects]
      summary: Cria projeto
      description: Projeto inicia `ativo`; criação registrada no histórico e na auditoria (CA-027).
      x-trace: [RF-003, CA-027]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Projeto criado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Consulta projeto
      description: Consulta projeto.
      x-trace: [RF-003, CA-012]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Projeto
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Atualiza nome ou descrição
      description: Alteração auditada (RN-027).
      x-trace: [RF-003, RN-008]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Projeto atualizado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      tags: [projects]
      summary: Arquiva projeto (reversível)
      description: |
        Novos uploads passam a ser recusados (ERR-001); revisões em andamento continuam;
        relatórios permanecem; histórico registra data, hora e usuário (CA-027, DEC-027).
      x-trace: [RF-003, CA-027, DEC-027]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Projeto arquivado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /projects/{projectId}/unarchive:
    post:
      operationId: unarchiveProject
      tags: [projects]
      summary: Restaura projeto arquivado
      description: Restaura projeto arquivado.
      x-trace: [RF-003, CA-027, DEC-027]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Projeto restaurado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── forms (RF-004) ─────────────────────────────
  /projects/{projectId}/forms:
    get:
      operationId: listForms
      tags: [forms]
      summary: Lista formulários e versões de um projeto
      description: Lista formulários e versões de um projeto.
      x-trace: [RF-004]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de formulários
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms:
    post:
      operationId: createForm
      tags: [forms]
      summary: Cria formulário com a versão 1 em rascunho (vazia)
      description: Cria formulário com a versão 1 em rascunho (vazia).
      x-trace: [RF-004]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormCreate' }
      responses:
        '201':
          description: Formulário criado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms/{formId}/versions:
    post:
      operationId: createVersion
      tags: [forms]
      summary: Cria nova versão em rascunho (opcionalmente copiando outra)
      description: Alterações em versão publicada sempre criam nova versão (RN-042, CA-001).
      x-trace: [RF-004, CA-001, RN-042]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCreate' }
      responses:
        '201':
          description: Versão em rascunho criada
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms/{formId}/versions/{versionId}:
    get:
      operationId: getVersion
      tags: [forms]
      summary: Consulta versão completa (perguntas, opções e regras de salto)
      description: Consulta versão completa (perguntas, opções e regras de salto).
      x-trace: [RF-004]
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Versão
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      operationId: updateVersion
      tags: [forms]
      summary: Substitui o conteúdo de uma versão em rascunho
      description: |
        Versão publicada é imutável → ERR-009 (CA-001, TS-006). Regra de salto inválida
        (DEC-095) ou sensibilidade `identificacao` fora das perguntas da RN-047 (DEC-097) → ERR-001.
      x-trace: [RF-004, CA-001, CA-015, RN-042, TS-006, RN-021, DEC-095, DEC-097]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionContent' }
      responses:
        '200':
          description: Rascunho atualizado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionImmutable' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms/{formId}/versions/{versionId}/publish:
    post:
      operationId: publishVersion
      tags: [forms]
      summary: Publica versão (exige os campos obrigatórios)
      description: |
        Exige perguntas marcadas como nome, data de nascimento, CPF (tipo `cpf`), data e local
        da aplicação (RN-017); sem elas → ERR-036 (CA-036). Matriz sem linhas ou múltipla escolha
        sem `nenhuma_das_anteriores` (RN-047) → ERR-036 com os códigos das perguntas em `campos`
        (DEC-096). Grava o mapa de layout (DEC-048).
      x-trace: [RF-004, CA-036, RN-017, RN-047, DEC-048, DEC-096]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Versão publicada
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '400': { $ref: '#/components/responses/MissingPublishFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionImmutable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /forms/{formId}/versions/{versionId}/pdf:
    get:
      operationId: generatePdf
      tags: [forms]
      summary: Gera PDF imprimível com QR e marcadores por página
      description: |
        Cada página traz QR com identificador opaco da versão e número da página, e marcadores
        fiduciais (DEC-048). A página 1 traz o termo de consentimento do tenant
        (`termo_consentimento`, DEC-094) com campo de assinatura.
        Versão em rascunho não gera PDF → ERR-018 (CA-028).
      x-trace: [RF-004, CA-028, DEC-005, DEC-048, DEC-094]
      parameters:
        - $ref: '#/components/parameters/FormId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: PDF gerado
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────── upload (RF-006, RF-007) ─────────────────────────────
  /projects/{projectId}/applications/upload:
    post:
      operationId: uploadImages
      tags: [upload]
      summary: Upload de uma aplicação (um envio = uma pessoa, DEC-008)
      description: |
        Valida tipo, tamanho e páginas (DEC-029) e varre malware; recusa → 400 ERR-029 com o
        motivo; projeto arquivado → 400 ERR-001 (CA-027). Remove metadados (RN-040), valida QR
        e registra a imagem (DEC-048). O estado inicial segue a tabela de criação da FL-001; o
        campo `aviso` traz ERR-004, ERR-039 ou ERR-003 quando aplicável (CA-004, CA-039, CA-030).
      x-trace: [RF-006, CA-003, CA-004, CA-013, CA-029, CA-039, CA-040, RN-040, DEC-029]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '202':
          description: Aplicação criada
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResponse' }
        '400': { $ref: '#/components/responses/FileRejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /applications/{applicationId}/identify:
    post:
      operationId: identifyApplication
      tags: [upload]
      summary: Identificação manual de versão e páginas (aplicação em identificacao_pendente)
      description: |
        O digitalizador informa a versão e o número de cada página, ou corrige as páginas.
        Continua inválido → 400 ERR-004 ou ERR-039. Versão de outro tenant, de outro projeto ou
        inexistente → 400 ERR-039, auditado (DEC-100). Próximo estado conforme FL-001.
      x-trace: [RF-006, CA-004, CA-013, CA-039, CA-040, DEC-100]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentifyRequest' }
      responses:
        '200':
          description: Aplicação identificada
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/QrInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /applications/{applicationId}/pages:
    post:
      operationId: addApplicationPages
      tags: [upload]
      summary: Acrescenta páginas a uma aplicação em identificacao_pendente (CA-013)
      description: |
        Corrige página faltante: mesmas validações do upload (ERR-029, RN-040, DEC-042) e
        reavaliação da tabela de criação da FL-001. Permitido também em projeto arquivado (DEC-098).
      x-trace: [RF-006, CA-013, CA-040, RN-040, DEC-098]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '200':
          description: Páginas acrescentadas
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/FileRejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /applications/{applicationId}/pages/{pageId}/image:
    get:
      operationId: getPageImage
      tags: [upload]
      summary: Link assinado (5 min) da imagem de uma página, para identificação e conferência de assinatura
      description: |
        Usada para identificar páginas em `identificacao_pendente` e para conferir a assinatura
        (RN-044). Na página 1 devolve a região da assinatura do mapa de layout (DEC-048).
        Permitida em `identificacao_pendente` e nos estados de revisão (FL-001); nos demais →
        ERR-018. Acesso auditado (DEC-099, DEC-112).
