# CI (PLANO §9.4): consistência, contrato, testes de integração com PostgreSQL 17 real,
# segredos (gitleaks), análise estática (Semgrep, DEC-089), dependências e SBOM.
# ESLint e mutação (DEC-052) no job qualidade. Pendente: E2E com as telas.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consistencia:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependência do validador
        run: pip install pyyaml==6.0.2
      - name: Registros CSV gerados a partir da REQ e do PLANO (DEC-049)
        run: python3 tools/gerar_registros.py --check
      - name: Consistência cruzada REQ × PLANO × contrato × registros
        run: python3 tools/validar_consistencia.py

  contrato:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint do contrato (Spectral)
        run: npm run lint:spec
      - name: Quebra de compatibilidade do contrato (oasdiff)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:contracts/openapi.yaml" > /tmp/openapi-base.yaml
          docker run --rm -v /tmp:/base -v "$PWD/contracts:/head" tufin/oasdiff:v1.11.7 \
            breaking /base/openapi-base.yaml /head/openapi.yaml --fail-on ERR

  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck dos testes
        run: npm run typecheck:tests
      - name: Build e testes (Vitest; integração com PostgreSQL 17 via Testcontainers)
        run: npm test

  # DEC-053: o PR de implementação (IA-DEV) não altera testes aprovados. Só PR com o rótulo
  # ia-test pode mexer neles. O rótulo e a junção dependem do responsável (ver
  # tests/README.md sobre a regra da main, DEC-213).
  testes-congelados:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Testes aprovados não mudam fora de PR ia-test
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IA_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'ia-test') }}
        run: |
          alterados=$(git diff --name-only "$BASE_SHA"...HEAD -- tests vitest.config.ts)
          if [ -n "$alterados" ] && [ "$IA_TEST" != "true" ]; then
            echo "::error::Este PR altera testes aprovados (DEC-053) sem o rótulo ia-test:"
            echo "$alterados"
            exit 1
          fi
          echo "ok: ${alterados:-nenhum teste alterado}"

  seguranca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Segredos no histórico (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --exit-code 1
      - name: Análise estática (Semgrep, DEC-089)
        run: |
          pip install semgrep==1.182.1
          semgrep scan --config p/typescript --config p/nodejs --config p/secrets --error --metrics=off apps packages
      - name: Dependências de produção sem falha alta ou crítica
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  qualidade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Teste de mutação (Stryker, DEC-052; mínimo 80%)
        run: npm run test:mutacao
